# Render blueprint: one web service runs the API and serves the built client.
#
# PERSISTENCE: the SQLite database and uploaded files (project images, resume PDF) live on the
# filesystem. Without a persistent disk Render's filesystem is EPHEMERAL - every deploy or
# restart wipes messages, analytics, edits and uploads, and the app re-seeds from scratch.
# Render allows one disk per service, so both are placed on a single disk mounted at /var/data:
#   /var/data/portfolio.db   (DB_PATH)      <- "/data"
#   /var/data/uploads        (UPLOAD_DIR)   <- "/uploads"
# Disks are not available on the free plan. To try the free plan anyway, set `plan: free`,
# delete the `disk:` block and accept that data resets on every deploy.
services:
  - type: web
    name: jitendra-portfolio
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/portfolio.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SERVER_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_USERNAME
        value: DHULIPALLA-JITENDRA-VARMA
      - key: GITHUB_URL
        value: https://github.com/DHULIPALLA-JITENDRA-VARMA
      - key: GITHUB_TOKEN
        sync: false
      - key: LINKEDIN_URL
        value: https://www.linkedin.com/in/jitendra-varma-dhulipalla-66b796304/
      - key: SITE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_TO
        sync: false
